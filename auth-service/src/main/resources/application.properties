spring.application.name=auth-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.url=@DB_URL@
spring.datasource.username=@DB_USERNAME@
spring.datasource.password=@DB_PASSWORD@
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

jwt.secret=@JWT_SECRET@
jwt.expiration-hours=24
google.client-id=@GOOGLE_CLIENT_ID@

storage.service.base-url=${STORAGE_SERVICE_BASE_URL:http://localhost:8080/storage-service}

# --- Email (password reset) ---
# SMTP connection. Values are injected at build time from Jenkins credentials,
# matching the @PLACEHOLDER@ pattern used above. For local runs you can override
# any of these on the command line, e.g. -Dspring.mail.host=...
spring.mail.host=@MAIL_HOST@
spring.mail.port=@MAIL_PORT@
spring.mail.username=@MAIL_USERNAME@
spring.mail.password=@MAIL_PASSWORD@
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# "From" address shown on reset emails.
app.mail.from=@MAIL_FROM@

# Public URL of the reset page the emailed link points to. The token is
# appended as ?token=... . Defaults to the production auth-service path.
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:https://group-6-15.pvt.dsv.su.se/auth-service/auth/reset-password}